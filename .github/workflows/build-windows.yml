name: Validar compilação Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Preparar ícone
        run: pnpm exec node scripts/prepare-icon.mjs

      - name: Verificar TypeScript
        run: pnpm exec tsc -p tsconfig.json

      - name: Compilar interface
        run: pnpm exec vite build

      - name: Empacotar aplicativo Windows
        run: pnpm exec electron-builder --win dir

      - name: Publicar artefato para conferência
        uses: actions/upload-artifact@v4
        with:
          name: gestao-oliveira-windows
          path: release/0.1.0/win-unpacked/
          if-no-files-found: error
